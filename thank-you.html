<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in — PorchDrop</title>
<meta name="description" content="You're on the PorchDrop waitlist. We'll let you know the moment it's time.">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<!-- Google tag (gtag.js) -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#2C8792; --teal-dark:#206770; --orange:#FFAF54; --orange-dark:#E89236;
    --cream:#FBFAF8; --paper:#F3EFE6; --ink:#19181C; --ink-soft:#6F7478; --line: rgba(25,24,28,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--cream);color:var(--ink);
    font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;
    padding:28px;-webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:480px;text-align:center;background:#fff;border-radius:20px;
    padding:48px 36px;box-shadow:0 14px 30px -10px rgba(25,24,28,0.18);
  }
  .badge{
    width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:1.8rem;
  }
  h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.7rem;margin:0 0 14px;letter-spacing:-0.01em;}
  p{color:var(--ink-soft);font-size:1.02rem;line-height:1.6;margin:0 0 26px;}
  .logo-lockup{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px;text-decoration:none;}
  .logo-badge{width:28px;height:28px;border-radius:7px;display:block;object-fit:cover;flex-shrink:0;}
  .logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--ink);}
  .logo span{color:var(--orange-dark);}
  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:var(--ink);
    font-weight:700;font-size:0.92rem;padding:11px 22px;border-radius:999px;text-decoration:none;
    border:2px solid var(--ink);transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:3px 4px 0 var(--ink);}
</style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="logo-lockup"><img src="images/porchdrop-social-card.jpg" alt="PorchDrop icon" class="logo-badge"><span class="logo">Porch<span>Drop</span></span></a>
    <div class="badge">✓</div>
    <h1>You're on the list.</h1>
    <p>No spam, just the launch news the moment it's ready. In the meantime, your porch can keep doing whatever it's been doing.</p>
    <a href="index.html" class="btn">Back to the site</a>
  </div>
</body>
</html>
